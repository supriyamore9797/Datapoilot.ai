[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore:.*A single label was found in 'y_true' and 'y_pred'.*:UserWarning
markers =
    needs_plotly: tests that render real Plotly figures (skipped automatically when plotly is not installed)
